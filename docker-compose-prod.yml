# 实验室资产管理系统 - 生产环境 Docker Compose 配置
# 使用 Nginx 反向代理统一前后端访问入口

services:
  # 后端服务（不对外暴露端口，仅通过内部网络访问）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lab-backend
    # 不暴露端口到宿主机，仅内部网络访问
    expose:
      - "5000"
    volumes:
      - backend-data:/app/data
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///app/data/lab_asset_management.db
    networks:
      - lab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 前端服务（不对外暴露端口）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # API 地址通过相对路径访问，由 Nginx 代理
        - VITE_API_BASE_URL=/api
    container_name: lab-frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - lab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Nginx 反向代理（统一入口）
  nginx:
    image: nginx:alpine
    container_name: lab-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # 如果配置 SSL，挂载证书目录
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lab-network
    restart: unless-stopped

# 数据卷
volumes:
  backend-data:
    driver: local

# 网络
networks:
  lab-network:
    driver: bridge
